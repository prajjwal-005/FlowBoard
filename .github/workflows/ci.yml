name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: flowboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/flowboard_test?sslmode=disable
      DIRECT_URL: postgresql://test:test@localhost:5432/flowboard_test?sslmode=disable
      JWT_SECRET: ci-test-secret
      REDIS_URL: redis://localhost:6379/1
      ALLOW_DB_RESET: "true"
      OPENAI_API_KEY: dummy
      CLOUDINARY_URL: cloudinary://dummy:dummy@dummy
      CLOUDINARY_CLOUD_NAME: dummy
      CLOUDINARY_API_KEY: dummy
      CLOUDINARY_API_SECRET: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint

      - name: Start test server
        run: npm run test:server > server.log 2>&1 &

      - name: Wait for server
        run: npx --yes wait-on tcp:127.0.0.1:3000 --timeout 120000

      - name: Run tests
        run: npx vitest run

      - name: Show server log on failure
        if: failure()
        run: cat server.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build .